# The app (urllib) sends a GET to page.url with User-Agent: WebpageMonitor/1.0
# and considers the site UP when 200 <= status_code < 400.
# Users monitor https://mocksite.local so we must serve HTTPS on 443.

server {
    listen 80 default_server;
    listen 443 ssl default_server;

    server_name mocksite.local localhost _;

    ssl_certificate     /etc/nginx/certs/mocksite.crt;
    ssl_certificate_key /etc/nginx/certs/mocksite.key;

    access_log off;
    error_log /dev/stderr warn;

    location / {
        default_type text/html;
        return 200 "<html><body>OK</body></html>\n";
    }
}
